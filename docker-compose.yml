services:
  valheim:
    image: ghcr.io/ekman/valheim:2
    build:
      context: .
    restart: unless-stopped
    read_only: true
    volumes:
      - "./config:/home/steam/config"
      - "./game:/home/steam/game"
    ports: [ 2456-2458:2456-2458/udp ]
    environment:
      - NAME=My server
      - WORLD=My world
      - PASSWORD=secret
    stop_grace_period: 2m
    command:
      - -name
      - Foo
      - -world
      - Bar
      - -port
      - "2465"
      - -password
      - abc123
      - -public
      - "0"
